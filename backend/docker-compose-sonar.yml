services:
  sonar-postgres:
    image: postgres:17
    container_name: bondtradex-sonar-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar

    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sonar -d sonarqube"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - sonar-network

  sonarqube:
    image: sonarqube:community
    container_name: bondtradex-sonarqube
    restart: unless-stopped

    depends_on:
      sonar-postgres:
        condition: service_healthy

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar

    ports:
      - "9000:9000"

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

    networks:
      - sonar-network

volumes:
  sonar_postgres_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  sonar-network:
    driver: bridge
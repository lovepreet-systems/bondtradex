############################################
# Server
############################################
server.port=8082

############################################
# Application
############################################
spring.application.name=ioi-service

############################################
# PostgreSQL
############################################
spring.datasource.url=jdbc:postgresql://localhost:5432/ioi_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / Hibernate
############################################
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

############################################
# Flyway
############################################
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
############################################
# Redis
############################################
spring.data.redis.host=localhost
spring.data.redis.port=6379
############################################
# OAuth2 Resource Server
############################################
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:8081

############################################
# Actuator
############################################
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

############################################
# Micrometer
############################################
management.metrics.tags.application=ioi-service

############################################
# Logging
############################################
logging.level.org.springframework.security=INFO
logging.level.com.bondtradex.ioi=INFO

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=ioi-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
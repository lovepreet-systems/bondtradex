############################################
# Server
############################################

server.port=${SERVER_PORT:8082}

############################################
# Application
############################################

spring.application.name=ioi-service

############################################
# PostgreSQL
############################################

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ioi_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / Hibernate
############################################

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

############################################
# Flyway
############################################

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

############################################
# Redis
############################################

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

############################################
# Spring Cache
############################################

spring.cache.type=redis
spring.cache.redis.time-to-live=${REDIS_CACHE_TTL:10m}
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true

############################################
# OAuth2 Resource Server
############################################

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://auth-service:8081}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://auth-service:8081/oauth2/jwks}

############################################
# Actuator
############################################

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# Added for Kubernetes
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

############################################
# Micrometer
############################################

management.metrics.tags.application=ioi-service

############################################
# Logging
############################################

logging.level.org.springframework.security=INFO
logging.level.com.bondtradex.ioi=INFO
logging.pattern.correlation=[traceId=%X{traceId} spanId=%X{spanId}]

############################################
# Kafka cluster
############################################

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-0.kafka-headless.bondtradex.svc.cluster.local:9092,kafka-1.kafka-headless.bondtradex.svc.cluster.local:9092,kafka-2.kafka-headless.bondtradex.svc.cluster.local:9092}

############################################
# Kafka producer
############################################

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:10}
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

############################################
# Kafka consumer
############################################

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:ioi-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

############################################
# Kafka topics
############################################

app.kafka.topics.ioi-events=${IOI_EVENTS_TOPIC:ioi-events}
app.kafka.topics.ioi-events-dlt=${IOI_EVENTS_DLT_TOPIC:ioi-events-dlt}
app.kafka.topics.ioi-events-replay=${IOI_EVENTS_REPLAY_TOPIC:ioi-events-replay}

############################################
# Downstream retry / DLT plan
############################################

app.kafka.consumer.retry.max-attempts=${KAFKA_CONSUMER_RETRY_MAX_ATTEMPTS:4}
app.kafka.consumer.retry.initial-interval=${KAFKA_CONSUMER_RETRY_INITIAL_INTERVAL:1s}
app.kafka.consumer.retry.multiplier=${KAFKA_CONSUMER_RETRY_MULTIPLIER:2.0}
app.kafka.consumer.retry.max-interval=${KAFKA_CONSUMER_RETRY_MAX_INTERVAL:10s}

############################################
# Transactional Outbox
############################################

app.outbox.publisher.batch-size=${OUTBOX_BATCH_SIZE:100}
app.outbox.publisher.fixed-delay-ms=${OUTBOX_FIXED_DELAY_MS:1000}
app.outbox.publisher.max-retries=${OUTBOX_MAX_RETRIES:5}
app.outbox.publisher.retry-delay-seconds=${OUTBOX_RETRY_DELAY_SECONDS:30}
app.outbox.publisher.recovery-delay-ms=${OUTBOX_RECOVERY_DELAY_MS:60000}
app.outbox.publisher.processing-timeout-seconds=${OUTBOX_PROCESSING_TIMEOUT_SECONDS:120}

############################################
# Micrometer Tracing
############################################

management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}

############################################
# OTLP Exporter / Tempo
############################################

management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://tempo:4318/v1/traces}

############################################
# Resilience4j
############################################

resilience4j.circuitbreaker.instances.kafkaPublisher.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaPublisher.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.kafkaPublisher.sliding-window-size=10
resilience4j.circuitbreaker.instances.kafkaPublisher.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.kafkaPublisher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaPublisher.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.kafkaPublisher.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.kafkaPublisher.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.timelimiter.instances.kafkaPublisher.timeout-duration=5s
resilience4j.timelimiter.instances.kafkaPublisher.cancel-running-future=true

management.health.circuitbreakers.enabled=true
############################################################
# Spring Profile / Application
############################################################
spring.application.name=ioi-service-test

############################################################
# PostgreSQL Test Database
############################################################
spring.datasource.url=jdbc:postgresql://localhost:5432/bondtradex_ioi_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.kafka.admin.auto-create=false
spring.kafka.admin.enabled=false
############################################################
# HikariCP
############################################################
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

############################################################
# JPA / Hibernate
############################################################
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

############################################################
# Flyway
############################################################
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

############################################################
# Kafka
############################################################

# Dummy bootstrap server.
# Kafka listeners are disabled below, so tests should not
# actually try to consume messages.
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=ioi-service-test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

############################################################
# Kafka Topics
#
# These properties are required even when listeners are
# disabled because Spring still resolves @KafkaListener
# placeholders during ApplicationContext creation.
############################################################
app.kafka.topics.ioi-events=ioi-events
app.kafka.topics.ioi-events-dlt=ioi-events-dlt
app.kafka.topics.ioi-events-replay=ioi-events-replay

############################################################
# Kafka Retry Configuration
############################################################
app.kafka.consumer.retry.max-attempts=4
app.kafka.consumer.retry.initial-interval=1s
app.kafka.consumer.retry.multiplier=2.0
app.kafka.consumer.retry.max-interval=10s

############################################################
# Disable Kafka Listeners During Tests
############################################################
spring.kafka.listener.auto-startup=false

############################################################
# Transactional Outbox
############################################################
app.outbox.publisher.batch-size=100
app.outbox.publisher.fixed-delay-ms=1000
app.outbox.publisher.max-retries=5
app.outbox.publisher.retry-delay-seconds=30
app.outbox.publisher.recovery-delay-ms=60000
app.outbox.publisher.processing-timeout-seconds=120

############################################################
# Disable Scheduling During Tests
############################################################
spring.task.scheduling.enabled=false

############################################################
# Redis / Cache
############################################################
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# Avoid depending on Redis cache during Spring integration tests
spring.cache.type=none

############################################################
# OAuth2 Resource Server
############################################################
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/oauth2/jwks

############################################################
# Tracing
############################################################
management.tracing.enabled=false

############################################################
# Logging
############################################################
logging.level.org.springframework.security=INFO
logging.level.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.bondtradex.ioi=INFO

############################################################
# Actuator
############################################################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

############################################################
# Jackson
############################################################
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
############################################
# Application
############################################

spring.application.name=api-gateway

############################################
# Server
############################################

server.port=${SERVER_PORT:8080}

############################################
# Redis
############################################

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

############################################
# JWT validation
############################################

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://127.0.0.1:8081}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}

############################################
# Service URLs
############################################

bondtradex.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}

bondtradex.services.ioi-url=${IOI_SERVICE_URL:http://localhost:8082}

############################################
# Gateway routes
############################################

spring.cloud.gateway.server.webflux.routes[0].id=auth-route

spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/oauth2/**,/login/**,/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=ioi-route

spring.cloud.gateway.server.webflux.routes[1].uri=${IOI_SERVICE_URL:http://localhost:8082}

spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/iois/**,/api/admin/**

############################################
# Circuit breaker
############################################

spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker

spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=ioiCircuitBreaker

spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/ioi

############################################
# Rate limiter
############################################

spring.cloud.gateway.server.webflux.routes[1].filters[1].name=RequestRateLimiter

spring.cloud.gateway.server.webflux.routes[1].filters[1].args.key-resolver=#{@authenticatedUserKeyResolver}

spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.replenishRate=${IOI_RATE_REPLENISH:20}

spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.burstCapacity=${IOI_RATE_BURST:40}

spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.requestedTokens=1

############################################
# Resilience4j
############################################

resilience4j.circuitbreaker.instances.ioiCircuitBreaker.sliding-window-size=20

resilience4j.circuitbreaker.instances.ioiCircuitBreaker.minimum-number-of-calls=10

resilience4j.circuitbreaker.instances.ioiCircuitBreaker.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.ioiCircuitBreaker.wait-duration-in-open-state=20s

############################################
# CORS
############################################

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${ALLOWED_ORIGIN:http://127.0.0.1:5173}

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*

############################################
# Actuator
############################################

management.endpoints.web.exposure.include=health,info,prometheus,metrics,gateway,env

management.endpoint.health.show-details=always

management.endpoint.health.probes.enabled=true

management.endpoint.gateway.access=read-only

############################################
# Metrics
############################################

management.metrics.tags.application=api-gateway

############################################
# OpenTelemetry
############################################

management.tracing.enabled=true

management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}

management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

############################################
# Logging
############################################

logging.level.org.springframework.cloud.gateway=INFO

logging.level.org.springframework.security=INFO

logging.level.com.bondtradex.gateway=INFO

logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=DEBUG

logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=DEBUG
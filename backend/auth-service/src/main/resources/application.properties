############################################
# Application
############################################

spring.application.name=auth-service

############################################
# Server
############################################

server.port=${SERVER_PORT:8081}

############################################
# PostgreSQL
############################################

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / Hibernate
############################################

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

############################################
# Flyway
############################################

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

############################################
# Actuator
############################################

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

############################################
# Micrometer
############################################

management.metrics.tags.application=auth-service

############################################
# Authorization server
############################################

app.security.issuer=${AUTH_ISSUER:http://127.0.0.1:8081}

# CODE_VERIFIER=LVpH6NYm7r3gYNlUslZXCVLPGILpaOhq5FL2aI-rhqI
# CODE_CHALLENGE=Ybuo5bwy3k1I1uvCJsa9TVR98HrbEeE47ac1Y_SK14M

############################################
# Redis connection
############################################

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

############################################
# Authorization cache
############################################

bondtradex.cache.authorization.ttl=${AUTH_CACHE_TTL:7d}
bondtradex.cache.authorization.prefix=${AUTH_CACHE_PREFIX:bondtradex:auth:}

############################################
# Kafka cluster
############################################

# Local/IntelliJ fallback addresses. Docker Compose overrides this with:
# kafka-1:29092,kafka-2:29092,kafka-3:29092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}

############################################
# Kafka producer defaults
############################################

# These settings are used only if auth-service publishes Kafka records.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:10}
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

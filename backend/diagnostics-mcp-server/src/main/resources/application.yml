server:
  address: 127.0.0.1
  port: 8091

spring:
  application:
    name: diagnostics-mcp-server

  ai:
    mcp:
      server:
        enabled: true
        name: bondtradex-diagnostics
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
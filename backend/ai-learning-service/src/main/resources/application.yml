server:
  port: 8090


# Manual Ollama client
ai:
  ollama:
    base-url: http://localhost:11434
    model: gemma3:1b

# Spring AI
spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma3:1b
      embedding:
        model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

    mcp:
      client:
        enabled: true
        name: bondtradex-ai-client
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            diagnostics:
              url: http://127.0.0.1:8091
              endpoint: /mcp

  datasource:
    url: jdbc:postgresql://localhost:5435/ai_learning
    username: ai_user
    password: ai_password
    driver-class-name: org.postgresql.Driver

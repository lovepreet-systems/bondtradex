services:
  prometheus:
    image: prom/prometheus:latest
    container_name: bondtradex-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    restart: unless-stopped

    networks:
      - bondtradex-network

  grafana:
    image: grafana/grafana:latest
    container_name: bondtradex-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus
      - loki
      - tempo

    restart: unless-stopped

    networks:
      - bondtradex-network

  loki:
    image: grafana/loki:latest
    container_name: bondtradex-loki

    ports:
      - "3100:3100"

    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    restart: unless-stopped

    networks:
      - bondtradex-network

  alloy:
    image: grafana/alloy:latest
    container_name: bondtradex-alloy

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    ports:
      - "12345:12345"

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

    depends_on:
      - loki

    restart: unless-stopped

    networks:
      - bondtradex-network

  tempo:
    image: grafana/tempo:2.8.4
    container_name: bondtradex-tempo

    command:
      - "-config.file=/etc/tempo/tempo.yml"

    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

    restart: unless-stopped

    networks:
      - bondtradex-network

  auth-postgres:
    image: postgres:17-alpine
    container_name: bondtradex-auth-postgres
    hostname: auth-postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
      - ./postgres/auth-init:/docker-entrypoint-initdb.d:ro

    restart: unless-stopped

    networks:
      - bondtradex-network

  ioi-postgres:
    image: postgres:17-alpine
    container_name: bondtradex-ioi-postgres
    hostname: ioi-postgres

    ports:
      - "5434:5432"

    environment:
      POSTGRES_DB: ioi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - ioi-postgres-data:/var/lib/postgresql/data
      - ./postgres/ioi-init:/docker-entrypoint-initdb.d:ro

    restart: unless-stopped

    networks:
      - bondtradex-network

  kafka-1:
    image: apache/kafka:4.3.1
    container_name: bondtradex-kafka-1
    hostname: kafka-1

    ports:
      - "9092:9092"

    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-1-data:/var/lib/kafka/data

    restart: unless-stopped

    networks:
      - bondtradex-network

  kafka-2:
    image: apache/kafka:4.3.1
    container_name: bondtradex-kafka-2
    hostname: kafka-2

    ports:
      - "9094:9094"

    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-2-data:/var/lib/kafka/data

    restart: unless-stopped

    networks:
      - bondtradex-network

  kafka-3:
    image: apache/kafka:4.3.1
    container_name: bondtradex-kafka-3
    hostname: kafka-3

    ports:
      - "9096:9096"

    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9096,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9096

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-3-data:/var/lib/kafka/data

    restart: unless-stopped

    networks:
      - bondtradex-network

  redis:
    image: redis:8.6.5-alpine
    container_name: bondtradex-redis

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

    networks:
      - bondtradex-network

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile

    container_name: bondtradex-auth-service

    ports:
      - "8081:8081"

    environment:
      SERVER_PORT: 8081

      DB_URL: jdbc:postgresql://auth-postgres:5432/auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT: 2s
      REDIS_TIMEOUT: 2s

      AUTH_CACHE_TTL: 7d
      AUTH_CACHE_PREFIX: "bondtradex:auth:"

      AUTH_ISSUER: http://127.0.0.1:8081

      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092

    depends_on:
      auth-postgres:
        condition: service_started

      redis:
        condition: service_healthy

      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started

    restart: unless-stopped

    networks:
      - bondtradex-network

  ioi-service:
    build:
      context: ../ioi-service
      dockerfile: Dockerfile

    container_name: bondtradex-ioi-service

    ports:
      - "8082:8082"

    environment:
      SERVER_PORT: 8082

      DB_URL: jdbc:postgresql://ioi-postgres:5432/ioi_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT: 2s
      REDIS_TIMEOUT: 2s
      REDIS_CACHE_TTL: 10m

      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CONSUMER_GROUP: ioi-service-group
      IOI_EVENTS_TOPIC: ioi-events

      # Must match the issuer claim generated by auth-service.
      AUTH_ISSUER: http://127.0.0.1:8081

      # Internal Docker URL used to download public signing keys.
      AUTH_JWK_SET_URI: http://auth-service:8081/oauth2/jwks

      # Internal Docker URL for Tempo.
      OTLP_ENDPOINT: http://tempo:4318/v1/traces

      TRACING_SAMPLING_PROBABILITY: 1.0

      OUTBOX_BATCH_SIZE: 100
      OUTBOX_FIXED_DELAY_MS: 1000
      OUTBOX_MAX_RETRIES: 5
      OUTBOX_RETRY_DELAY_SECONDS: 30
      OUTBOX_RECOVERY_DELAY_MS: 60000
      OUTBOX_PROCESSING_TIMEOUT_SECONDS: 120

    depends_on:
      ioi-postgres:
        condition: service_started

      redis:
        condition: service_healthy

      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started

      auth-service:
        condition: service_started

      tempo:
        condition: service_started

    restart: unless-stopped

    networks:
      - bondtradex-network

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile

    container_name: bondtradex-api-gateway

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080

      AUTH_SERVICE_URL: http://auth-service:8081
      IOI_SERVICE_URL: http://ioi-service:8082

      # Must match the iss claim contained in access tokens.
      AUTH_ISSUER: http://127.0.0.1:8081

      # Used internally by the container to retrieve the public key.
      AUTH_JWK_SET_URI: http://auth-service:8081/oauth2/jwks

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT: 2s
      REDIS_TIMEOUT: 2s

      OTLP_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: 1.0

      ALLOWED_ORIGIN: http://127.0.0.1:5173

      IOI_RATE_REPLENISH: 20
      IOI_RATE_BURST: 40

    depends_on:
      redis:
        condition: service_healthy

      auth-service:
        condition: service_started

      ioi-service:
        condition: service_started

      tempo:
        condition: service_started

    healthcheck:
      test:
        - CMD-SHELL
        - >
          wget --no-verbose --tries=1 --spider
          http://localhost:8080/actuator/health/readiness
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - bondtradex-network

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  tempo-data:
  auth-postgres-data:
  ioi-postgres-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  redis-data:

networks:
  bondtradex-network:
    driver: bridge
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: kafka
  namespace: bondtradex

spec:
  serviceName: kafka-headless

  replicas: 3

  podManagementPolicy: Parallel

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: kafka

          image: apache/kafka:4.3.1

          imagePullPolicy: IfNotPresent

          ports:
            - name: broker
              containerPort: 9092

            - name: controller
              containerPort: 9093

          command:
            - /bin/bash
            - -ec
            - |
              ORDINAL="${HOSTNAME##*-}"
              export KAFKA_NODE_ID="${ORDINAL}"

              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.bondtradex.svc.cluster.local:9092"

              exec /etc/kafka/docker/run

          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk

            - name: KAFKA_PROCESS_ROLES
              value: broker,controller

            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: >-
                0@kafka-0.kafka-headless.bondtradex.svc.cluster.local:9093,
                1@kafka-1.kafka-headless.bondtradex.svc.cluster.local:9093,
                2@kafka-2.kafka-headless.bondtradex.svc.cluster.local:9093

            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"

            - name: KAFKA_NUM_PARTITIONS
              value: "3"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"

            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data

          readinessProbe:
            tcpSocket:
              port: broker

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            tcpSocket:
              port: broker

            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

  volumeClaimTemplates:
    - metadata:
        name: kafka-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi
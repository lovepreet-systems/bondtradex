apiVersion: v1
kind: Service
metadata:
  name: {{ include "bondtradex-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bondtradex-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "bondtradex-service.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
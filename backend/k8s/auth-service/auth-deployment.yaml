apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: bondtradex

  labels:
    app: auth-service

spec:
  replicas: 1

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      serviceAccountName: auth-service-account

      terminationGracePeriodSeconds: 30

      containers:
        - name: auth-service

          image: infrastructure-auth-service:latest

          # The image exists in Docker Desktop's local image store.
          # Never tells Kubernetes not to download it from Docker Hub.
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          envFrom:
            - configMapRef:
                name: auth-config

          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: DB_PASSWORD

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http

            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http

            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http

            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 1Gi

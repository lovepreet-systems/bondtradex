apiVersion: v1
kind: ConfigMap

metadata:
  name: auth-config
  namespace: bondtradex

data:
  SERVER_PORT: "8081"

  DB_URL: "jdbc:postgresql://auth-postgres:5432/auth_db"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_CONNECT_TIMEOUT: "2s"
  REDIS_TIMEOUT: "2s"

  AUTH_CACHE_TTL: "7d"
  AUTH_CACHE_PREFIX: "bondtradex:auth:"

  # During local Kubernetes development, we will expose auth-service
  # through port-forwarding on localhost:8081.
  AUTH_ISSUER: "http://127.0.0.1:8081"

  KAFKA_BOOTSTRAP_SERVERS: >-
    kafka-0.kafka-headless.bondtradex.svc.cluster.local:9092,
    kafka-1.kafka-headless.bondtradex.svc.cluster.local:9092,
    kafka-2.kafka-headless.bondtradex.svc.cluster.local:9092